<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111d29">
<title>認定証を開く | 伊見内商会</title>
<link rel="icon" href="assets/images/mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/experience.css">
<script defer src="js/storage.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/main.js"></script>
<script defer src="js/certificate.js"></script>
<script defer src="js/certificate-view.js"></script>
</head>
<body data-page="certificate">
<a class="skip" href="#main">本文へ移動</a>
<div id="site-header"></div>
<main id="main" class="section certificate-view">
<p class="eyebrow">YOUR CERTIFICATE</p>
<h1 id="certificate-title">認定証を準備しています。</h1>
<p id="certificate-status" role="status">この端末でPNG画像を生成します。</p>
<div id="certificate-content" hidden>
<p>Androidなどで保存ボタンが反応しない場合は、画像を長押しして保存してください。「画像だけを開く」もご利用いただけます。</p>
<div class="certificate-actions"><a class="button gold" id="certificate-save" download>PNGを保存 ↓</a><a class="button outline" id="certificate-raw" target="_blank" rel="noopener noreferrer">画像だけを開く ↗</a><button class="button outline" type="button" id="certificate-share" hidden>画像をアプリで共有 ↗</button></div>
<p id="certificate-share-note" class="completion-share-note" hidden></p>
<a class="text-link" id="certificate-x" target="_blank" rel="noopener noreferrer">Xの投稿画面を開く ↗</a>
<p class="fine">アプリ共有では、共有先一覧からXなどを選んでください。対応状況は端末・ブラウザ・アプリによって異なります。投稿や送信はご自身で確定します。</p>
<img id="certificate-image" alt="生成した認定証のPNG画像">
</div>
<a class="text-link" href="mypage.html">マイページへ戻る ↗</a>
</main>
<div id="site-footer"></div><div id="toast-region" aria-live="polite"></div>
</body>
</html>
